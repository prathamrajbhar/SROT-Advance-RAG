# Local development infrastructure.
# Dedicated 7xxx host ports keep this project's databases isolated from
# every other project sharing this machine.
# Note: PostgreSQL is hosted externally as specified in .env.

services:
  redis:
    image: redis:7.4-alpine
    container_name: srot-redis
    restart: unless-stopped
    ports:
      - "7379:6379"
    volumes:
      - srot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: srot-qdrant
    restart: unless-stopped
    ports:
      - "7333:6333"
      - "7334:6334"
    volumes:
      - srot_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  srot_redis_data:
  srot_qdrant_data:
