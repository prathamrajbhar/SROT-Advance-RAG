# Local development infrastructure.
# Dedicated 7xxx host ports keep this project's databases isolated from
# every other project sharing this machine.

services:
  postgres:
    image: postgres:16-alpine
    container_name: srot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: private_pgsql
      POSTGRES_PASSWORD: apple
      POSTGRES_DB: srot
    ports:
      - "7432:5432"
    volumes:
      - srot_pgsql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U private_pgsql -d srot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  srot_pgsql_data:
