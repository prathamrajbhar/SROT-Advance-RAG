name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-backend:
    name: Test & Validate Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: private_pgsql
          POSTGRES_PASSWORD: apple
          POSTGRES_DB: srot
        ports:
          - 7432:5432
        options: >-
          --health-cmd "pg_isready -U private_pgsql -d srot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://private_pgsql:apple@localhost:7432/srot
          CORS_ORIGINS: '["http://localhost:3000"]'
        run: pytest -v

  test-frontend:
    name: Typecheck & Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: https://api.placeholder.com
        run: npm run build
