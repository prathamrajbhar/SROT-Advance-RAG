name: Production Deployment (Vercel Frontend & Server Stack)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        working-directory: apps/web
        run: |
          npx --yes vercel@latest deploy --prod \
            --token="$VERCEL_TOKEN" \
            --yes \
            --build-env API_URL=https://srot_backend.bytemap.in

  deploy-backend:
    name: Deploy Backend via PM2 & Docker to Server
    runs-on: ubuntu-latest
    needs: deploy-frontend
    if: always()

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.3
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME || 'jarvis' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 900s
          envs: PROD_ENV_FILE
          script: |
            set -e

            [ -f "$HOME/.profile" ] && source "$HOME/.profile" || true
            [ -f "$HOME/.bashrc" ] && source "$HOME/.bashrc" || true
            [ -s "$HOME/.nvm/nvm.sh" ] && source "$HOME/.nvm/nvm.sh" || true
            export PATH="$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:$HOME/.npm-global/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:$PATH"

            PROJECT_DIR="/home/jarvis/SharedDrive/Force/SROT-Advance-RAG"
            echo "Syncing $PROJECT_DIR from origin/main"
            cd "$PROJECT_DIR"
            git fetch origin main
            git reset --hard origin/main

            if [ -n "$PROD_ENV_FILE" ]; then
              printf "%s\n" "$PROD_ENV_FILE" > .env
              chmod 600 .env
              echo "Wrote production .env"
            else
              echo "No PROD_ENV_FILE secret, keeping existing .env"
            fi

            echo "Starting PostgreSQL"
            docker compose -f infra/docker-compose.yml up -d --remove-orphans
            for i in {1..30}; do
              if docker compose -f infra/docker-compose.yml exec -T postgres pg_isready -U private_pgsql -d srot >/dev/null 2>&1; then
                echo "PostgreSQL ready"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "PostgreSQL never became ready"
                exit 1
              fi
              sleep 1
            done

            cd "$PROJECT_DIR/apps/api"
            [ -d .venv ] || python3 -m venv .venv
            .venv/bin/python -m pip install --upgrade pip setuptools wheel
            .venv/bin/python -m pip install -r requirements.txt

            .venv/bin/alembic upgrade head

            command -v pm2 >/dev/null 2>&1 || { echo "pm2 not found"; exit 1; }
            pm2 delete srot-api 2>/dev/null || true
            pm2 start ecosystem.config.cjs
            pm2 save

            echo "Waiting for health on :8087"
            for i in {1..15}; do
              if curl -sf http://127.0.0.1:8087/health >/dev/null 2>&1; then
                echo "Health check passed: $(curl -s http://127.0.0.1:8087/health)"
                echo "Deployment complete"
                exit 0
              fi
              sleep 2
            done

            echo "Backend failed its health check"
            curl -s http://127.0.0.1:8087/health || echo "(no response)"
            pm2 logs srot-api --lines 50 --nostream || true
            exit 1
