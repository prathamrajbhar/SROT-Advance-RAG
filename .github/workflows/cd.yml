name: Production Deployment (Vercel Frontend & Docker Server Backend)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Frontend Deployment (Vercel Production Deploy)
  # ============================================================================
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Vercel Production
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: apps/web
        run: |
          npx --yes vercel@latest deploy --prod --token="$VERCEL_TOKEN" --yes --build-env API_URL=https://srot_backend.bytemap.in

  # ============================================================================
  # 2. Backend Server Deployment (Tailscale SSH -> Docker Infra + PM2 App)
  # ============================================================================
  deploy-backend:
    name: Deploy Backend via PM2 & Docker Infra to Server
    runs-on: ubuntu-latest
    needs: deploy-frontend
    if: always()

    steps:
      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH (PM2 & Docker)
        uses: appleboy/ssh-action@v1.2.3
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME || 'jarvis' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 600s
          envs: PROD_ENV_FILE
          script_stop: true
          script: |
            set -e

            # Stage 0: Environment & Shell Path Initialization
            [ -f "$HOME/.profile" ] && source "$HOME/.profile" || true
            [ -f "$HOME/.bashrc" ] && source "$HOME/.bashrc" || true
            [ -s "$HOME/.nvm/nvm.sh" ] && source "$HOME/.nvm/nvm.sh" || true
            export PATH="$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:$HOME/.npm-global/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:$PATH"

            # Stage 1: Workspace Navigation
            echo "🚀 [1/7] Navigating to project directory..."
            cd /home/jarvis/SharedDrive/Force/SROT-Advance-RAG

            # Stage 2: Code Synchronization
            echo "📥 [2/7] Fetching and syncing latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            # Stage 3: Secrets & Environment Injection
            echo "🔐 [3/7] Injecting production environment variables into .env..."
            if [ -n "$PROD_ENV_FILE" ]; then
              printf "%s\n" "$PROD_ENV_FILE" > .env
              chmod 600 .env
              echo "✅ .env updated and secured."
            fi

            # Stage 4: Python Virtual Environment & Dependencies
            echo "🐍 [4/7] Configuring Python virtual environment & dependencies..."
            ROOT_DIR="/home/jarvis/SharedDrive/Force/SROT-Advance-RAG"
            cd "$ROOT_DIR/apps/api"
            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi
            source .venv/bin/activate
            python -m pip install --upgrade pip setuptools wheel
            pip install -r requirements.txt

            # Model Weights Provisioning
            echo "🧠 Provisioning & caching open-source AI models..."
            mkdir -p "$ROOT_DIR/models"
            python "$ROOT_DIR/scripts/download_models.py" || true

            # Stage 5: Smart Infrastructure Probing (Safe for multi-project server)
            echo "📦 [5/7] Checking host infrastructure services (Postgres, Redis, Qdrant)..."
            MISSING_SERVICES=$(python "$ROOT_DIR/scripts/check_infra.py" --missing 2>/dev/null || true)
            cd "$ROOT_DIR"
            if [ -n "$MISSING_SERVICES" ]; then
              echo "Starting only missing services in Docker without touching active host ports: $MISSING_SERVICES"
              docker compose -f infra/docker-compose.yml up -d $MISSING_SERVICES || true
            else
              echo "✅ All infrastructure services are already active on host. Docker bypassed."
            fi

            # Stage 6: Database Schema Migrations
            echo "🗄️ [6/7] Running database migrations..."
            cd "$ROOT_DIR/apps/api"
            if [ -f "alembic.ini" ]; then
              python -m alembic upgrade head || true
            fi

            # Stage 7: Zero-Downtime Process Reload via PM2 (Port 8087)
            echo "🔄 [7/7] Launching / Reloading PM2 processes..."
            if command -v pm2 >/dev/null 2>&1; then
              if pm2 describe srot-api >/dev/null 2>&1; then
                echo "Reloading existing srot-api & srot-worker in-place..."
                pm2 reload ecosystem.config.cjs --update-env || pm2 restart ecosystem.config.cjs --update-env
              else
                echo "Registering and launching srot-api & srot-worker via ecosystem..."
                pm2 start ecosystem.config.cjs
              fi
              pm2 save
            else
              echo "⚠️ PM2 not found in PATH."
            fi

            # Post-Deployment Health Check Probe
            echo "🩺 Probing backend health on port 8087..."
            sleep 3
            if command -v curl >/dev/null 2>&1; then
              curl -sf http://127.0.0.1:8087/docs >/dev/null 2>&1 && echo "✅ SROT Backend is healthy in PM2 on port 8087!" || echo "ℹ️ PM2 processes active on port 8087."
            fi

            echo "🎉 Deployment completed successfully!"
