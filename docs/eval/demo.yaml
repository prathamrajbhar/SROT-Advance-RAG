questions:
  - id: "q1"
    question: "What is SROT?"
    ground_truth: "SROT is an Enterprise Multi-Project Multimodal RAG Platform."
  - id: "q2"
    question: "What object storage is supported?"
    ground_truth: "AWS S3 only, with LocalStack emulation in dev."
  - id: "q3"
    question: "How is AI provider configuration handled?"
    ground_truth: "Provider-agnostic AI model architecture configured entirely via environment variables (.env)."
  - id: "q4"
    question: "What retrieval method is used?"
    ground_truth: "Hybrid retrieval combining BM25 Postgres FTS and dense Qdrant ANN fused with RRF (k=60), followed by cross-encoder reranking."
  - id: "q5"
    question: "What happens when evidence is insufficient?"
    ground_truth: "The system outputs an insufficient_evidence verdict with a list of searched documents, never hallucinating."
  - id: "q6"
    question: "How is answer confidence calculated?"
    ground_truth: "Composite formula: 0.45*faithfulness + 0.30*top_reranker_score + 0.15*retrieval_coverage + 0.10*(1-latency_penalty)."
  - id: "q7"
    question: "What audio transcription engine is integrated?"
    ground_truth: "faster-whisper large-v3 with ffmpeg audio extraction."
  - id: "q8"
    question: "What commands are used for monorepo lifecycle?"
    ground_truth: "npm run setup for bootstrapping and npm run dev for concurrent orchestration."
  - id: "q9"
    question: "What are the supported multimodal document formats?"
    ground_truth: "PDF, DOCX, MD, TXT, XLSX/CSV, MP3, and MP4."
  - id: "q10"
    question: "How are parent and child chunks organized?"
    ground_truth: "Child chunks (150-300 tokens) are embedded and retrieved, while parent chunks (up to 1500 tokens) are fetched at answer time for context."
